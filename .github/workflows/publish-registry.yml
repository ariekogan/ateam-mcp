name: Publish to MCP Registry

on:
  # After the npm release (the registry checks the npm package exists).
  workflow_run:
    workflows: ["Publish to npm"]
    types: [completed]
    branches: [main]
  # A server.json change (icon, title, new version) re-publishes the listing.
  push:
    branches: [main]
    paths: ['server.json']
  workflow_dispatch:

# GitHub OIDC login: no token stored anywhere.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
      - name: Login (GitHub OIDC)
        run: ./mcp-publisher login github-oidc
      - name: Publish
        # npm can take minutes to show a new release: retry for ~10 min.
        run: |
          for i in $(seq 1 20); do
            ./mcp-publisher publish && exit 0
            echo "attempt $i failed, retrying in 30s"; sleep 30
          done
          exit 1
