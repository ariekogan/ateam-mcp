name: Publish to npm

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'package.json'
  # Lets a person re-run a release from the Actions tab without a new commit.
  workflow_dispatch:

# npm trusted publishing: npm trusts this workflow by its GitHub identity
# (OIDC), so there is no npm token to create, store, or let expire. The
# trusted publisher is set once on npmjs.com for @ateam-ai/mcp:
# repository ariekogan/ateam-mcp, workflow publish.yml.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 24 ships npm 11, which trusted publishing needs (npm 11.5.1+).
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Exactly the lockfile, or the release stops. This used to be
      # `npm ci … 2>/dev/null || npm install …` (324eb47): a failing `npm ci`
      # was silenced and replaced by a fresh, unpinned resolution, and the
      # lockfile carried merge-conflict markers from d5bc9d9 (2026-07-01) on
      # without this step ever saying so. test/release-metadata.test.mjs keeps
      # it this way.
      - name: Install deps
        run: npm ci --ignore-scripts

      # A red main does not publish. From 324eb47 this workflow never ran a
      # test: it shipped whatever main held. Same job, before the publish
      # step, no continue-on-error: a failing test ends the release here.
      # ci.yml runs the same suite on every PR; this is the last gate.
      # test/release-metadata.test.mjs keeps the order.
      - name: Test
        run: npm test

      # No NODE_AUTH_TOKEN: npm signs in with the workflow's OIDC identity.
      - name: Publish to npm
        run: npm publish --access public
