name: Publish to npm

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'package.json'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Exactly the lockfile, or the release stops. This used to be
      # `npm ci … 2>/dev/null || npm install …` (324eb47): a failing `npm ci`
      # was silenced and replaced by a fresh, unpinned resolution, and the
      # lockfile carried merge-conflict markers from d5bc9d9 (2026-07-01) on
      # without this step ever saying so. test/release-metadata.test.mjs keeps
      # it this way.
      - name: Install deps
        run: npm ci --ignore-scripts

      # A red main does not publish. From 324eb47 this workflow never ran a
      # test: it shipped whatever main held. Same job, before the publish
      # step, no continue-on-error: a failing test ends the release here.
      # ci.yml runs the same suite on every PR; this is the last gate.
      # test/release-metadata.test.mjs keeps the order.
      - name: Test
        run: npm test

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM }}
