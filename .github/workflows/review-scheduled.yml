name: AI Review (scheduled)

# The unattended checkpoint review. Every 2 hours it reviews what has landed since
# the last marker — and when nothing has landed it exits at zero cost, which is why
# a frequent timer is safe on a quiet repo.
#
# The cap is the point. Two hours of heavy work is a large spend that nobody chose,
# so a repo needing more than MAX_SLICES is reported and SKIPPED: its marker does
# not move, nothing is lost, and the next interactive `codex review` picks it up
# with a human looking at the numbers.
#
# Two repo variables control it, so neither needs a code change:
#   SCHEDULED_REVIEW=off       stop the timer
#   SCHEDULED_REVIEWER=claude  review with Claude instead of Codex (default codex)

on:
  schedule:
    - cron: '17 */2 * * *'      # :17 avoids the top-of-hour queue on GitHub's schedulers
  workflow_dispatch:
    inputs:
      reviewer:
        description: "codex or claude"
        required: false
        type: string
        default: "codex"
      max_slices:
        description: "Skip a repo needing more slices than this"
        required: false
        type: string
        default: "8"
      dry:
        description: "Decide and report, spend nothing"
        required: false
        type: boolean
        default: false

permissions:
  contents: write     # the runner banks the codex-reviewed marker tag
  actions: write      # it dispatches codex-review-range.yml
  issues: write

concurrency:
  group: scheduled-review
  cancel-in-progress: false     # never kill a review mid-slice; a slice half-paid is a slice wasted

jobs:
  review:
    # WHERE THIS RUNS. GitHub-hosted minutes are finite on a private repo, and when
    # they run out the job is simply never picked up: "The job was not acquired by
    # Runner of type hosted" — which looks like an agent failure and is not one.
    # Set repo variable REVIEW_RUNNER='["self-hosted","mac1"]' to use the machine
    # that is already there and free. Unset falls back to hosted, so a repo without
    # a runner keeps working.
    runs-on: ${{ vars.REVIEW_RUNNER && fromJSON(vars.REVIEW_RUNNER) || 'ubuntu-latest' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      # A self-hosted runner does not inherit a login shell's PATH, so the tools a
      # hosted runner has by default are simply absent: `gh` lives in /usr/local/bin
      # or /opt/homebrew/bin on mac1 and neither was on PATH. Every gh call then died
      # with exit 127 — "command not found" — which surfaced as a preflight failure
      # claiming the workflow differed from the default branch. It did not.
      - name: Make local tooling visible (self-hosted runners)
        run: |
          # APPEND (see codex-review-range.yml): prepending shadows the pinned Node.
          EXTRA=""
          for d in /opt/homebrew/bin /usr/local/bin; do
            [ -d "$d" ] && EXTRA="${EXTRA}:${d}"
          done
          [ -n "$EXTRA" ] && echo "PATH=${PATH}${EXTRA}" >> "$GITHUB_ENV"
          true


      - name: Off switch
        id: gate
        env:
          SETTING: ${{ vars.SCHEDULED_REVIEW }}
        run: |
          if [ "${SETTING:-on}" = "off" ]; then
            echo "::notice::SCHEDULED_REVIEW=off — skipping."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Review what landed since the last checkpoint
        if: steps.gate.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Every dispatch input goes through env, never into the script body. An
          # input interpolated with ${{ }} is substituted as TEXT before bash sees
          # it, so a crafted value runs as a command — the standard Actions script
          # injection. This file's sibling was fixed for exactly this; the scheduler
          # reintroduced it.
          # Manual dispatch > repo variable > default. A cap of 3 stalled overnight:
          # a night of work is ~5 slices, so the scheduler declined every run and
          # reviewed nothing. 8 covers an unattended night while still refusing a
          # genuinely huge backlog, and SCHEDULED_MAX_SLICES changes it with no push.
          MAX_SLICES: ${{ inputs.max_slices || vars.SCHEDULED_MAX_SLICES || '8' }}
          IN_REVIEWER: ${{ inputs.reviewer }}
          VAR_REVIEWER: ${{ vars.SCHEDULED_REVIEWER }}
          IN_DRY: ${{ inputs.dry }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # A manual dispatch wins; otherwise the repo variable; otherwise codex.
          REVIEWER="${IN_REVIEWER:-${VAR_REVIEWER:-codex}}"
          # Validate rather than trust: the value reaches a paid agent, and an
          # unknown reviewer silently falls through to the wrong provider.
          case "$REVIEWER" in
            codex|claude) ;;
            *) echo "::error::reviewer must be codex or claude (got '${REVIEWER}')"; exit 1 ;;
          esac
          DRY=""; [ "${IN_DRY:-false}" = "true" ] && DRY="--dry"
          # MAX_SLICES likewise: it is arithmetic downstream, so refuse a non-number.
          case "${MAX_SLICES:-3}" in
            ''|*[!0-9]*) echo "::error::max_slices must be a number (got '${MAX_SLICES}')"; exit 1 ;;
          esac
          .github/scripts/review-scheduled.sh "$REVIEWER" $DRY \
            | tee "$RUNNER_TEMP/scheduled.log"
          # The decision is worth seeing even when it decided to do nothing.
          { echo '## Scheduled review'; echo '```'; cat "$RUNNER_TEMP/scheduled.log"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
